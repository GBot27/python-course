[project]
name = "python-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "gabriel-neuralseek", email = "gabriel@neuralseek.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
python-course = "python_course:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]


[tool.pytest.ini_options]
pythonpath = ["practice"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88